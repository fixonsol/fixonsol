<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>$FIX — Beaver Guy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111111;
            color: #f5f5f5;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .logo {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: -4px;
            margin-bottom: 10px;
        }

        .beaver {
            font-size: 100px;
            margin-bottom: 20px;
        }

        .tagline {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtext {
            font-size: 20px;
            color: #aaaaaa;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            padding: 16px 32px;
            background: #f5a623;
            color: #111111;
            text-decoration: none;
            font-weight: 900;
            border-radius: 8px;
            transition: 0.2s;
        }

        .button:hover {
            transform: scale(1.05);
        }

        .section {
            padding: 80px 20px;
            max-width: 900px;
            margin: auto;
        }

        .section h2 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .section p {
            font-size: 18px;
            line-height: 1.7;
            color: #bbbbbb;
        }

        .token {
            margin-top: 30px;
            padding: 30px;
            border: 1px solid #333333;
            border-radius: 12px;
        }

        footer {
            padding: 40px 20px;
            color: #666666;
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="beaver">🦫</div>

        <div class="logo">$FIX</div>

        <div class="tagline">
            EVERYTHING IS BROKEN.
        </div>

        <div class="subtext">
            Don't worry. I can fix it. 🔧
        </div>

        <a class="button" href="#story">
            ENTER THE WORKSHOP
        </a>

    </section>


    <section class="section" id="story">

        <h2>THE STORY</h2>

        <p>
            Everything is broken.
            <br><br>
            Fortunately, Beaver Guy has a wrench.
            <br><br>
            $FIX is here to fix what nobody else can.
        </p>

    </section>


    <section class="section">

        <h2>$FIX</h2>

        <div class="token">

            <p>
                Token information coming soon.
                <br><br>
                Contract: TBA
                <br>
                Network: Solana
            </p>

        </div>

    </section>


    <footer>

        $FIX — Beaver Guy 🔧🦫

    </footer>

</body>
</html>
